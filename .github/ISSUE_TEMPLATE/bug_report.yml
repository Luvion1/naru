name: Bug Report
description: Report a bug to help us improve Naru
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us what you expected to happen
      placeholder: Describe the bug here...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Run 'naru ...'
        2. See error...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Naru Version
      placeholder: e.g., v0.1.0
    validations:
      required: true
