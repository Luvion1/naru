[package]
name = "naru-config"
version = "0.6.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/Luvion1/naru"
description = "A security-first configuration manager with encryption and audit logging"
documentation = "https://github.com/Luvion1/naru/tree/master/docs"
keywords = ["config", "encryption", "security", "aes", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0.69"
dotenvy = "0.15.7"
serde_yaml = "0.9"
aes-gcm = "0.10.3"
hex = "0.4.3"
rand = "0.8.5"
toml = "0.8"
chrono = { version = "0.4.43", features = ["serde"] }
regex = "1.12"
dialoguer = "0.12.0"
console = "0.16"
fs2 = "0.4.3"
sha2 = "0.10"
argon2 = "0.5"
unicode-normalization = "0.1.25"
zeroize = "1.8"

[dev-dependencies]
serial_test = "3.3.1"
tempfile = "3.14"
