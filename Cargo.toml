[package]
name = "naru"
version = "0.5.0"
edition = "2021"
description = "A security-first configuration manager with encryption and audit logging"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "1.0.63"
dotenvy = "0.15.7"
serde_yaml = "0.9.34"
aes-gcm = "0.10.3"
hex = "0.4.3"
rand = "0.8.5"
toml = "0.8.19"
chrono = { version = "0.4.38", features = ["serde"] }
regex = "1.10.0"
dialoguer = "0.12.0"
console = "0.16.2"
fs2 = "0.4.3"
sha2 = "0.10.9"
argon2 = "0.5"
unicode-normalization = "0.1"
zeroize = "1.6"

[dev-dependencies]
serial_test = "3.3.1"
tempfile = "3.8"
